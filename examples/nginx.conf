server {
    listen 443 ssl http2;
    server_name counter.example.com;

    # Add your normal TLS certificate configuration here.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # The service itself returns no-cache headers, but keeping this here
        # prevents an accidental proxy cache from swallowing GET increments.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
